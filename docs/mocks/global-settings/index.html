<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Global settings interaction mock</title>
    <link rel="stylesheet" href="pimote.css" />
  </head>
  <body>
    <main class="mock">
      <section id="device" class="device" aria-label="Interaction mock">
        <div class="viewport">
          <span>Viewport:</span>
          <button id="desktop" aria-pressed="true">Desktop</button>
          <button id="mobile" aria-pressed="false">Mobile</button>
          <span>Open Settings with the gear.</span>
        </div>
        <div class="home">
          <div class="brand">Pimote</div>
          <div class="search">Search folders</div>
          <div class="folders">
            <strong>Folders</strong>
            <p>Folder rows appear here.</p>
          </div>
        </div>
        <button id="gear" class="gear" aria-label="Open Settings" title="Open Settings">⚙</button>

        <div id="backdrop" class="backdrop" role="presentation">
          <section class="dialog" role="dialog" aria-modal="true" aria-label="Global settings files">
            <header class="header">
              <button id="close" class="mobile-only" type="button" aria-label="Close Settings">Close</button>
              <div class="file-summary">
                <strong id="label"></strong>
                <span id="meta"></span>
              </div>
              <button class="mobile-only primary save-file" type="button">Save</button>
            </header>
            <nav id="tabs" class="tabs" aria-label="Settings files"></nav>
            <div id="format-tools" class="format-tools" hidden><button id="wrap" type="button">Tag</button></div>
            <textarea id="editor" class="editor" aria-label="Settings file editor"></textarea>
            <footer class="footer desktop-only">
              <span id="status" class="status" aria-live="polite"></span>
              <button id="cancel" type="button">Cancel</button>
              <button class="primary save-file" type="button">Save</button>
            </footer>
          </section>
          <div id="confirm" class="confirm" role="presentation">
            <section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
              <h2 id="confirm-title">Discard unsaved changes?</h2>
              <p>One or more settings files have unsaved edits.</p>
              <div class="confirm-actions">
                <button id="keep" type="button">Keep editing</button>
                <button id="discard" type="button">Discard</button>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
    <script>
      const files = [
        { label: 'AGENTS.md', path: '<effective-agent-dir>/AGENTS.md', content: '# Agent instructions\n', exists: true },
        { label: 'settings.json', path: '<effective-agent-dir>/settings.json', content: '{\n  "defaultThinkingLevel": "high"\n}\n', exists: true },
        { label: 'config.json', path: '<effective-pimote-config-path>', content: '', exists: false },
        { label: 'extension.json', path: '<extension-dir>/extension.json', content: '{\n  "enabled": true\n}\n', exists: true },
      ].map((file) => ({ ...file, draft: file.content, dirty: false }));
      const device = document.getElementById('device');
      const backdrop = document.getElementById('backdrop');
      const confirm = document.getElementById('confirm');
      const tabs = document.getElementById('tabs');
      const editor = document.getElementById('editor');
      const label = document.getElementById('label');
      const meta = document.getElementById('meta');
      const tools = document.getElementById('format-tools');
      const wrap = document.getElementById('wrap');
      const saveButtons = [...document.querySelectorAll('.save-file')];
      const status = document.getElementById('status');
      let active = 0;

      function viewport(mobile) {
        device.classList.toggle('mobile', mobile);
        document.getElementById('desktop').setAttribute('aria-pressed', String(!mobile));
        document.getElementById('mobile').setAttribute('aria-pressed', String(mobile));
      }

      function selectFile(index) {
        active = index;
        render();
        editor.focus();
      }

      function renderTabs() {
        tabs.replaceChildren(
          ...files.map((file, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = file.label;
            button.className = index === active ? 'active' : '';
            if (file.dirty) button.classList.add('dirty');
            button.setAttribute('aria-selected', String(index === active));
            button.onclick = () => selectFile(index);
            return button;
          }),
        );
      }

      function render() {
        const file = files[active];
        const extension = file.label.split('.').pop()?.toLowerCase();
        const state = file.dirty ? 'Unsaved changes' : !file.exists ? 'New file' : '';
        label.textContent = file.label;
        meta.textContent = `${file.path}${state ? ` · ${state}` : ''}`;
        editor.value = file.draft;
        tools.hidden = extension !== 'md' && extension !== 'markdown';
        saveButtons.forEach((button) => {
          button.disabled = !file.dirty;
        });
        status.textContent = state;
        renderTabs();
      }

      function requestClose() {
        if (files.some((file) => file.dirty)) confirm.classList.add('open');
        else backdrop.classList.remove('open');
      }

      editor.oninput = () => {
        const file = files[active];
        file.draft = editor.value;
        file.dirty = file.draft !== file.content;
        render();
      };

      saveButtons.forEach((button) => {
        button.onclick = () => {
          const file = files[active];
          file.content = file.draft;
          file.exists = true;
          file.dirty = false;
          render();
        };
      });

      wrap.onclick = () => window.alert('Markdown tag wrapping uses the shared snippets.');
      document.getElementById('gear').onclick = () => {
        backdrop.classList.add('open');
        render();
        editor.focus();
      };
      document.getElementById('close').onclick = requestClose;
      document.getElementById('cancel').onclick = requestClose;
      document.getElementById('keep').onclick = () => confirm.classList.remove('open');
      document.getElementById('discard').onclick = () => {
        files.forEach((file) => {
          file.draft = file.content;
          file.dirty = false;
        });
        confirm.classList.remove('open');
        backdrop.classList.remove('open');
        render();
      };
      document.getElementById('desktop').onclick = () => viewport(false);
      document.getElementById('mobile').onclick = () => viewport(true);
      render();
    </script>
  </body>
</html>
