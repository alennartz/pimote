<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock: transcript surface</title>
    <link rel="stylesheet" href="mock.css" />
  </head>
  <body>
    <div class="mockbar">
      <strong>Transcript surface mock</strong>
      <label><input type="checkbox" id="mobileToggle" /> mobile width</label>
      <span class="muted">click an icon for actions · Redo from here = one click · Ctrl/Cmd+F = find</span>
      <a href="index.html" style="color: #93c5fd">index</a>
    </div>

    <div class="transcript-wrap panel">
      <div class="transcript" id="transcript">
        <div class="sticky-preview hidden" id="stickyPreview">
          <button class="avatar" id="stickyAvatar" title="Message actions">👤</button>
          <span class="line" id="stickyLine"></span>
          <span class="chip">previous message</span>
        </div>
        <div id="stream"></div>
      </div>
      <div class="findbar panel hidden" id="findbar">
        <input id="findInput" placeholder="Find in conversation" />
        <span class="muted" id="findCount"></span>
        <button class="btn" id="findPrev">↑</button>
        <button class="btn" id="findNext">↓</button>
        <button class="btn" id="findClose">✕</button>
      </div>
      <button class="jumpbtn hidden" id="jumpUp" title="Jump to previous message">↑</button>
    </div>

    <script>
      const MESSAGES = [
        { id: 'u1', role: 'user', text: 'Fix the failing retry test in server/src/event-buffer.test.ts' },
        { id: 'a1', role: 'assistant', text: 'I found the failure: the replay cursor assert assumes a monotonic wall clock. Let me patch the fixture to use an injected clock.' },
        { id: 'u2', role: 'user', text: 'Before you patch it — why did the cursor go backwards at all?', branches: 2 },
        {
          id: 'a2',
          role: 'assistant',
          text: 'The old cursor used Date.now() directly. Two buffers created in the same millisecond collided, so replay saw a stale cursor. Branch: one path patches the test, the other switches cursors to a counter.',
          branches: 1,
        },
        { id: 'u3', role: 'user', text: 'Switch to a monotonic counter seeded from wall clock, like DR-077 says.' },
        {
          id: 'a3',
          role: 'assistant',
          text: 'Done. The cursor base is now max(lastCursor, wallClockMs). I updated the stale-cursor test to assert the resync instead of the raw value.',
        },
        { id: 'u4', role: 'user', text: 'Run the whole server test suite to be safe.' },
        { id: 'a4', role: 'assistant', text: 'All 412 tests pass. The retry test still guards the same behavior with the injected clock.' },
        { id: 'u5', role: 'user', text: 'Commit it with a message that mentions DR-077.' },
        { id: 'a5', role: 'assistant', text: 'Committed as `fix: seed replay cursors from a wall-clock base (DR-077)`.' },
      ];
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const firstLine = (s) => s.split('\n')[0];

      const stream = document.getElementById('stream');
      const transcript = document.getElementById('transcript');
      const stickyPreview = document.getElementById('stickyPreview');
      const stickyLine = document.getElementById('stickyLine');
      const stickyAvatar = document.getElementById('stickyAvatar');

      function render(query = '') {
        stream.innerHTML = MESSAGES.map((m) => {
          let text = esc(m.text);
          if (query) {
            const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
            text = text.replace(re, (hit) => `<mark>${hit}</mark>`);
          }
          const avatar = m.role === 'user' ? '👤' : '🤖';
          return `<div class="msg ${m.role}" id="msg-${m.id}">
      <button class="avatar ${m.role === 'assistant' ? 'bot' : ''}" data-id="${m.id}" title="Message actions">${avatar}</button>
      <div class="bubble">${text}</div>
    </div>`;
        }).join('');
      }
      render();

      /* ---- message menu ---- */
      let menuEl = null;
      function closeMenu() {
        menuEl?.remove();
        menuEl = null;
      }
      document.addEventListener('click', (e) => {
        if (menuEl && !menuEl.contains(e.target) && !e.target.closest('.avatar')) closeMenu();
      });

      function openMenu(msg, x, y) {
        closeMenu();
        menuEl = document.createElement('div');
        menuEl.className = 'menu';
        const items = [
          `<button data-act="redo">↩︎ <strong>Redo from here</strong> <span class="muted">— one click, no compaction</span></button>`,
          `<button data-act="redo-custom">✍️ Redo with compaction…</button>`,
        ];
        if (msg.branches) {
          items.push(`<button data-act="branches">🌿 View existing branches (${msg.branches})</button>`);
        }
        if (msg.role === 'assistant') {
          items.push(`<button data-act="copy">📋 Copy message</button>`);
        }
        menuEl.innerHTML = items.join('');
        menuEl.addEventListener('click', (e) => {
          const act = e.target.closest('button')?.dataset.act;
          if (act === 'redo') {
            closeMenu();
            toast(`navigate_tree → ${msg.id} (no compaction) — session resyncs, branch kept`);
          }
          if (act === 'redo-custom') {
            closeMenu();
            openRedoModal(msg);
          }
          if (act === 'branches') {
            closeMenu();
            window.open('tree-explorer.html?focus=' + msg.id, '_blank');
          }
          if (act === 'copy') {
            closeMenu();
            toast('Copied (mock)');
          }
        });
        document.body.appendChild(menuEl);
        menuEl.style.left = Math.min(x, innerWidth - 280) + 'px';
        menuEl.style.top = y + 'px';
      }

      stream.addEventListener('click', (e) => {
        const btn = e.target.closest('.avatar');
        if (!btn) return;
        const msg = MESSAGES.find((m) => m.id === btn.dataset.id);
        const r = btn.getBoundingClientRect();
        openMenu(msg, r.left, r.bottom + 4);
      });

      /* ---- redo with compaction: modal ---- */
      let redoModalEl = null;
      function closeRedo() {
        redoModalEl?.remove();
        redoModalEl = null;
      }
      function openRedoModal(msg) {
        redoModalEl = document.createElement('div');
        redoModalEl.className = 'modal-overlay';
        redoModalEl.innerHTML = `
    <div class="redo-pop modal">
      <textarea placeholder="Compaction prompt…"></textarea>
      <div class="actions">
        <button class="btn" data-act="cancel">Cancel</button>
        <button class="btn primary" data-act="go">OK</button>
      </div>
    </div>`;
        redoModalEl.addEventListener('click', (e) => {
          const act = e.target.dataset.act;
          if (act === 'cancel' || e.target === redoModalEl) closeRedo();
          if (act === 'go') {
            closeRedo();
            toast(`navigate_tree → ${msg.id} with custom compaction — session resyncs`);
          }
        });
        document.body.appendChild(redoModalEl);
        redoModalEl.querySelector('textarea').focus();
      }

      function toast(text) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = text;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3500);
      }

      /* ---- sticky previous-user-message preview ---- */
      function updateSticky() {
        if (document.body.classList.contains('mobile')) {
          stickyPreview.classList.add('hidden');
          return;
        }
        const top = transcript.getBoundingClientRect().top;
        let prevUser = null;
        for (const m of MESSAGES) {
          const el = document.getElementById('msg-' + m.id);
          if (m.role === 'user' && el.getBoundingClientRect().bottom < top + 12) prevUser = m;
        }
        if (prevUser) {
          stickyPreview.classList.remove('hidden');
          stickyLine.textContent = firstLine(prevUser.text);
          stickyAvatar.dataset.id = prevUser.id;
        } else {
          stickyPreview.classList.add('hidden');
        }
      }
      transcript.addEventListener('scroll', updateSticky);
      stickyAvatar.addEventListener('click', (e) => {
        const msg = MESSAGES.find((m) => m.id === stickyAvatar.dataset.id);
        const r = stickyAvatar.getBoundingClientRect();
        openMenu(msg, r.left, r.bottom + 4);
      });
      updateSticky();

      /* ---- jump up (mobile pattern) ---- */
      const jumpUp = document.getElementById('jumpUp');
      jumpUp.addEventListener('click', () => {
        const top = transcript.getBoundingClientRect().top;
        let target = null;
        for (const m of MESSAGES) {
          const el = document.getElementById('msg-' + m.id);
          if (el.getBoundingClientRect().bottom < top - 4) target = el;
        }
        target?.scrollIntoView({ behavior: 'smooth' });
      });
      new MutationObserver(updateJump).observe(stream, { childList: true });
      function updateJump() {
        const mobile = document.body.classList.contains('mobile');
        const top = transcript.getBoundingClientRect().top;
        const anyAbove = MESSAGES.some((m) => document.getElementById('msg-' + m.id).getBoundingClientRect().bottom < top - 4);
        jumpUp.classList.toggle('hidden', !(mobile && anyAbove));
      }
      transcript.addEventListener('scroll', updateJump);

      /* ---- find bar ---- */
      const findbar = document.getElementById('findbar');
      const findInput = document.getElementById('findInput');
      const findCount = document.getElementById('findCount');
      let matches = [];
      let matchIdx = -1;
      function toggleFind(force) {
        const show = force ?? findbar.classList.contains('hidden');
        findbar.classList.toggle('hidden', !show);
        if (show) findInput.focus();
        else {
          setQuery('');
        }
      }
      function setQuery(q) {
        render(q.trim());
        matches = [...stream.querySelectorAll('mark')];
        matchIdx = -1;
        findCount.textContent = q.trim() ? `${matches.length} matches` : '';
        if (matches.length) stepMatch(1);
      }
      function stepMatch(dir) {
        if (!matches.length) return;
        matchIdx = (matchIdx + dir + matches.length) % matches.length;
        matches[matchIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          toggleFind(true);
        }
        if (e.key === 'Escape') toggleFind(false);
      });
      findInput.addEventListener('input', () => setQuery(findInput.value));
      document.getElementById('findNext').onclick = () => stepMatch(1);
      document.getElementById('findPrev').onclick = () => stepMatch(-1);
      document.getElementById('findClose').onclick = () => toggleFind(false);

      /* ---- mobile toggle ---- */
      document.getElementById('mobileToggle').addEventListener('change', (e) => {
        document.body.classList.toggle('mobile', e.target.checked);
        updateSticky();
        updateJump();
      });
    </script>
  </body>
</html>
